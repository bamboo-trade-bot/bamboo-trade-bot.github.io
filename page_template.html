<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{TITLE}}</title>
<meta name="description" content="{{TAGLINE}}">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@600;700&display=swap">
<style>
:root {
  color-scheme: light;
  --ground:   #f2f3f0;
  --panel:    #ffffff;
  --panel-2:  #f7f8f5;
  --ink:      #15181d;
  --ink-2:    #5b6572;
  --ink-3:    #8d95a1;
  --rule:     #e0e2df;
  --rule-2:   #ecedea;
  --accent:   #a8571b;
  --accent-soft: #f6ece2;
  --live:     #16794f;
  --live-soft:#e6f3ed;
  --rule-hover: #d3cec6;
  --shadow:   0 1px 2px rgba(21,24,29,.06), 0 8px 24px rgba(21,24,29,.05);
  --shadow-lift: 0 2px 4px rgba(21,24,29,.07), 0 14px 34px rgba(21,24,29,.09);
  --f-display: "Noto Serif TC", "Songti TC", serif;
  --f-body: "Noto Sans TC", -apple-system, "Segoe UI", sans-serif;
  --f-mono: "IBM Plex Mono", Consolas, monospace;
}
/* 深色色票跟處置股站同一套，兩邊切換過去才是同一個網站 */
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --ground:   #131518;
    --panel:    #1c1f24;
    --panel-2:  #22262c;
    --ink:      #eceef0;
    --ink-2:    #9aa4b1;
    --ink-3:    #737d8a;
    --rule:     #2a2e35;
    --rule-2:   #24282e;
    --accent:   #d98b47;
    --accent-soft: #2e241b;
    --live:     #3fae7a;
    --live-soft:#1b2b24;
    --rule-hover: #3a4048;
    --shadow:   0 1px 2px rgba(0,0,0,.4), 0 8px 24px rgba(0,0,0,.28);
    --shadow-lift: 0 2px 4px rgba(0,0,0,.45), 0 14px 34px rgba(0,0,0,.35);
  }
}
:root[data-theme="dark"] {
    color-scheme: dark;
    --ground:   #131518;
    --panel:    #1c1f24;
    --panel-2:  #22262c;
    --ink:      #eceef0;
    --ink-2:    #9aa4b1;
    --ink-3:    #737d8a;
    --rule:     #2a2e35;
    --rule-2:   #24282e;
    --accent:   #d98b47;
    --accent-soft: #2e241b;
    --live:     #3fae7a;
    --live-soft:#1b2b24;
    --rule-hover: #3a4048;
    --shadow:   0 1px 2px rgba(0,0,0,.4), 0 8px 24px rgba(0,0,0,.28);
    --shadow-lift: 0 2px 4px rgba(0,0,0,.45), 0 14px 34px rgba(0,0,0,.35);
}
* { box-sizing: border-box; }
body {
  margin: 0; background: var(--ground); color: var(--ink);
  font: 14px/1.55 var(--f-body);
  -webkit-font-smoothing: antialiased;
}
a { color: inherit; }
.wrap { max-width: 1080px; margin: 0 auto; padding: 0 20px; }

header { background: var(--panel); border-bottom: 1px solid var(--rule); }
.head-in { padding: 46px 0 40px; }
h1 {
  font: 700 32px/1.25 var(--f-display); margin: 0 0 10px;
  letter-spacing: .5px;
}
.tagline { color: var(--ink-2); font-size: 14px; max-width: 46em; margin: 0 0 18px; }
.head-meta { color: var(--ink-3); font-size: 12px; font-family: var(--f-mono); }
.head-meta a { color: var(--ink-2); text-decoration: none; border-bottom: 1px solid var(--rule); }
.head-meta a:hover { color: var(--accent); border-bottom-color: var(--accent); }
.head-meta .sep { margin: 0 8px; }

main { padding: 34px 0 80px; }

.section { margin-bottom: 34px; }
.section-head {
  display: flex; align-items: baseline; gap: 10px;
  padding-bottom: 9px; margin-bottom: 16px;
  border-bottom: 1px solid var(--rule);
}
.section-head h2 { font: 700 15px/1.3 var(--f-body); margin: 0; letter-spacing: .4px; }
.section-head .note { color: var(--ink-3); font-size: 12px; }

.grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 16px; }
@media (max-width: 760px) { .grid { grid-template-columns: 1fr; } }

.site {
  display: flex; flex-direction: column;
  background: var(--panel); border: 1px solid var(--rule);
  border-radius: 10px; box-shadow: var(--shadow);
  padding: 17px 19px 15px; text-decoration: none;
  transition: box-shadow .16s ease, border-color .16s ease, transform .16s ease;
}
a.site:hover {
  border-color: var(--rule-hover); box-shadow: var(--shadow-lift); transform: translateY(-2px);
}
a.site:hover h3 { color: var(--accent); }
a.site:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.site h3 { font: 700 17px/1.35 var(--f-display); margin: 0 0 7px; transition: color .16s ease; }
.site .desc { color: var(--ink-2); font-size: 13px; margin: 0 0 13px; }

.points { list-style: none; margin: 0 0 15px; padding: 0; display: flex; flex-wrap: wrap; gap: 6px; }
.points li {
  font-size: 11.5px; color: var(--ink-2); background: var(--panel-2);
  border: 1px solid var(--rule-2); border-radius: 4px; padding: 2px 8px;
}

.site-foot {
  margin-top: auto; padding-top: 11px; border-top: 1px solid var(--rule-2);
  display: flex; align-items: center; justify-content: space-between; gap: 10px;
  font-size: 11.5px; color: var(--ink-3); font-family: var(--f-mono);
}
.cadence { display: flex; align-items: center; gap: 6px; }
.dot { width: 6px; height: 6px; border-radius: 50%; background: var(--live); flex: none; }
.site.wip .dot { background: var(--ink-3); }
.go { color: var(--accent); font-weight: 600; white-space: nowrap; }
.fresh { color: var(--ink-3); }
.fresh b { color: var(--live); font-weight: 600; }

.site.wip { border-style: dashed; box-shadow: none; background: var(--panel-2); }
.site.wip h3 { color: var(--ink-2); }
.site.wip .go { color: var(--ink-3); font-weight: 400; }

footer {
  border-top: 1px solid var(--rule); padding: 20px 0 40px;
  color: var(--ink-3); font-size: 12px;
}
footer .built { font-family: var(--f-mono); }
</style>
</head>
<body>

<header>
  <div class="wrap head-in">
    <h1>{{TITLE}}</h1>
    <p class="tagline">{{TAGLINE}}</p>
    <div class="head-meta">
      <span>{{COUNT}} 個站台</span>
      <span class="sep">·</span>
      <span>頁面更新 {{GENERATED}}</span>
      <span class="sep">·</span>
      <a href="{{GITHUB}}">GitHub</a>
    </div>
  </div>
</header>

<main class="wrap">
{{SECTIONS}}
</main>

<footer>
  <div class="wrap">
    <span class="built">資料由 GitHub Actions 定時抓取，各站更新頻率見卡片下方。</span>
  </div>
</footer>

<script>
// 各站若有發佈 JSON，就順手把它的資料時間顯示在卡片上。
// 抓不到（檔案還沒生成、欄位改名、離線）就維持原本的空白，不影響頁面。
for (const el of document.querySelectorAll('[data-probe]')) {
  fetch(el.dataset.probe, { cache: 'no-cache' })
    .then(r => r.ok ? r.json() : Promise.reject(r.status))
    .then(d => {
      const raw = d[el.dataset.probeField];
      if (!raw) return;
      const t = new Date(raw);
      const s = isNaN(t) ? String(raw).slice(0, 16)
        : t.toLocaleString('zh-TW', { month: '2-digit', day: '2-digit',
                                      hour: '2-digit', minute: '2-digit', hour12: false });
      el.innerHTML = '資料 <b>' + s + '</b>';
    })
    .catch(() => {});
}
</script>

</body>
</html>
